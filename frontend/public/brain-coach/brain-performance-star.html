<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SleepOS Brain Performance Star</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020607;color:#effdfa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  background:
    radial-gradient(circle at 47% 47%,rgba(32,103,104,.27),transparent 35%),
    radial-gradient(circle at 66% 28%,rgba(48,66,121,.10),transparent 30%),
    linear-gradient(180deg,#071012,#020506 83%);
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.header{
  position:fixed;left:28px;top:24px;z-index:5;pointer-events:none;
}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(157,255,237,.58)}
h1{margin:7px 0 0;font-size:clamp(28px,3.5vw,44px);font-weight:560;letter-spacing:0}
.sub{margin-top:8px;font-size:12px;color:rgba(255,255,255,.38)}
.badge{
  display:inline-block;margin-top:8px;padding:5px 8px;border:1px solid rgba(255,255,255,.07);
  border-radius:999px;font-size:9px;color:rgba(255,255,255,.32)
}

.toolbar{
  position:fixed;right:24px;top:24px;z-index:10;display:flex;gap:6px;padding:6px;
  border:1px solid rgba(147,255,234,.11);border-radius:14px;
  background:rgba(4,15,17,.65);backdrop-filter:blur(16px)
}
button{
  appearance:none;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.46);
  border-radius:9px;padding:8px 10px;font:inherit;font-size:10px;cursor:pointer
}
button.active{background:rgba(115,255,230,.09);border-color:rgba(143,255,236,.13);color:#dffff8}

.legend{
  position:fixed;left:28px;bottom:24px;z-index:6;padding:11px 13px;
  border:1px solid rgba(255,255,255,.07);border-radius:14px;
  background:rgba(2,10,11,.48);backdrop-filter:blur(15px);
  font-size:9px;line-height:1.8;color:rgba(255,255,255,.3);pointer-events:none
}
.legend strong{color:rgba(255,255,255,.72);font-weight:600}

#tip{
  position:fixed;display:none;z-index:20;pointer-events:none;padding:10px 12px;border-radius:11px;
  background:rgba(2,10,12,.95);border:1px solid rgba(153,255,236,.2);
  font-size:10px;box-shadow:0 14px 36px rgba(0,0,0,.32)
}
#tip b{display:block;font-size:12px;margin-bottom:4px;color:#eafffb}
#tip span{display:block;color:rgba(255,255,255,.48);line-height:1.45}

.scale-card{
  position:fixed;right:24px;bottom:24px;z-index:6;width:155px;padding:12px 12px 10px;
  border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(2,10,11,.48);
  backdrop-filter:blur(15px);pointer-events:none
}
.scale-title{font-size:9px;color:rgba(255,255,255,.42);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em}
.scale-row{display:grid;grid-template-columns:18px 1fr;align-items:center;gap:7px;margin:5px 0;font-size:9px;color:rgba(255,255,255,.42)}
.scale-line{height:2px;border-radius:999px;background:rgba(143,255,236,.35)}

@media(max-width:850px){
  .header{left:16px;top:16px}
  .toolbar{right:12px;top:12px}
  .legend{left:16px;bottom:16px}
  .scale-card{display:none}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="header">
  <div class="eyebrow">3D brain performance profile</div>
  <h1>Brain Star</h1>
  <div class="sub">Attention, regulation, memory, and sleep-arousal signals</div>
  <div class="badge">DEMO DATA</div>
</div>

<div class="toolbar">
  <button id="labelsBtn" class="active">Labels</button>
  <button id="meshBtn" class="active">Mesh</button>
  <button id="autoBtn" class="active">Auto rotate</button>
  <button id="resetBtn">Reset</button>
</div>

<div class="legend">
  <strong>Reading the graph</strong><br>
  Center = 0 · Outer shell = 5<br>
  Large glowing node = current score<br>
  Drag to rotate · Scroll to zoom
</div>

<div class="scale-card">
  <div class="scale-title">Reference scale</div>
  <div class="scale-row"><span>1</span><div class="scale-line" style="opacity:.25"></div></div>
  <div class="scale-row"><span>2</span><div class="scale-line" style="opacity:.38"></div></div>
  <div class="scale-row"><span>3</span><div class="scale-line" style="opacity:.5"></div></div>
  <div class="scale-row"><span>4</span><div class="scale-line" style="opacity:.65"></div></div>
  <div class="scale-row"><span>5</span><div class="scale-line" style="opacity:.85"></div></div>
</div>

<div id="tip"></div>

<script>
(() => {
const AREAS = ["Physical", "Sleep", "Social", "Stress", "Anxiety", "Depression", "Anger", "Fear", "Attention / Tasks", "Self-Control", "Creativity", "Learning", "Memory", "Thinking"];
let scores = [3.7, 2.5, 4.1, 2.8, 2.4, 3.0, 3.8, 3.4, 2.9, 2.7, 4.2, 3.6, 3.1, 3.3];

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const tip=document.getElementById('tip');

let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
let yaw=-0.52,pitch=0.45,zoom=1.16;
let dragging=false,lastX=0,lastY=0;
let showLabels=true,showMesh=true,autoRotate=true;
let hitPoints=[];
let lastFrame=performance.now();
let resumeAutoAt=0;

const OUTER=335;
const n=AREAS.length;
const golden=Math.PI*(3-Math.sqrt(5));

// Fibonacci sphere directions
const dirs=[];
for(let i=0;i<n;i++){
  const y=1-(i/(n-1))*2;
  const r=Math.sqrt(Math.max(0,1-y*y));
  const theta=golden*i;
  dirs.push([Math.cos(theta)*r,y,Math.sin(theta)*r]);
}

function rot(p){
  let [x,y,z]=p;
  const cy=Math.cos(yaw),sy=Math.sin(yaw);
  [x,z]=[x*cy-z*sy,x*sy+z*cy];
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  [y,z]=[y*cp-z*sp,y*sp+z*cp];
  return [x,y,z];
}

function proj(p){
  const [x,y,z]=rot(p);
  const cam=1000;
  const s=cam/(cam+z+560)*zoom;
  return {x:W*.49+x*s,y:H*.53+y*s,z,s};
}

function posAt(i,level){
  const d=dirs[i],r=OUTER*(level/5);
  return [d[0]*r,d[1]*r,d[2]*r];
}

function line(a,b,color,width=1,alpha=1,dash=null){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  ctx.restore();
}

function dot(p,r,fill,glow=0,stroke=null,sw=1){
  ctx.save();
  if(glow){ctx.shadowColor=fill;ctx.shadowBlur=glow}
  ctx.fillStyle=fill;
  ctx.beginPath();
  ctx.arc(p.x,p.y,Math.max(1,r*p.s),0,Math.PI*2);
  ctx.fill();
  if(stroke){
    ctx.shadowBlur=0;
    ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke();
  }
  ctx.restore();
}

function colorFor(s){
  if(s>=4)return 'rgba(183,255,242,.99)';
  if(s>=3)return 'rgba(100,223,203,.98)';
  if(s>=2)return 'rgba(232,193,108,.96)';
  return 'rgba(235,124,115,.96)';
}

function neighborPairs(){
  const pairs=new Set();
  for(let i=0;i<n;i++){
    const sims=[];
    for(let j=0;j<n;j++)if(i!==j){
      const a=dirs[i],b=dirs[j];
      const d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
      sims.push([j,d]);
    }
    sims.sort((a,b)=>b[1]-a[1]);
    sims.slice(0,4).forEach(([j])=>{
      const key=i<j?i+','+j:j+','+i;
      pairs.add(key);
    });
  }
  return [...pairs].map(x=>x.split(',').map(Number));
}
const PAIRS=neighborPairs();

function trianglesFromPairs(){
  const edge=new Set(PAIRS.map(([a,b])=>a<b?a+','+b:b+','+a));
  const tris=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++){
    if(edge.has(i+','+j)&&edge.has(i+','+k)&&edge.has(j+','+k))tris.push([i,j,k]);
  }
  return tris;
}
const TRIS=trianglesFromPairs();

function roundedLabel(x,y,text,opts={}){
  const fs=opts.fs||10;
  ctx.save();
  ctx.font=`600 ${fs}px Inter,system-ui`;
  const tw=ctx.measureText(text).width;
  const px=opts.px||6,py=opts.py||4,w=tw+px*2,h=fs+py*2,r=7;
  const rx=x-w/2,ry=y-h/2;
  ctx.beginPath();
  ctx.moveTo(rx+r,ry);
  ctx.arcTo(rx+w,ry,rx+w,ry+h,r);
  ctx.arcTo(rx+w,ry+h,rx,ry+h,r);
  ctx.arcTo(rx,ry+h,rx,ry,r);
  ctx.arcTo(rx,ry,rx+w,ry,r);
  ctx.closePath();
  ctx.fillStyle=opts.bg||'rgba(2,10,12,.84)';
  ctx.fill();
  ctx.strokeStyle=opts.border||'rgba(255,255,255,.08)';
  ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=opts.color||'#eafffb';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x,y+.4);
  ctx.restore();
}

function drawGuideShell(level){
  const pts=dirs.map((_,i)=>proj(posAt(i,level)));

  PAIRS.forEach(([a,b])=>{
    const za=pts[a].z, zb=pts[b].z;
    const zAvg=(za+zb)/2;

    // Fade rear grid lines strongly; front lines remain readable.
    const depthNorm=Math.max(0,Math.min(1,(zAvg+OUTER)/(OUTER*2)));
    const frontness=1-depthNorm;

    // Inner shells are intentionally softer than outer shell.
    const shellStrength=level===5 ? 1 : 0.48 + level*0.055;
    const opacity=(0.025 + frontness*0.15) * shellStrength;

    line(
      pts[a],pts[b],
      `rgba(121,231,213,${opacity.toFixed(3)})`,
      level===5 ? 1.15 : 0.68,
      1
    );
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  hitPoints=[];
  const center=proj([0,0,0]);

  // clean 1–5 shells
  for(let level=1;level<=5;level++)drawGuideShell(level);

  // radial axes: no repeated numerical text clutter
  for(let i=0;i<n;i++){
    const out=proj(posAt(i,5));
    const axisFrontness=1-Math.max(0,Math.min(1,(out.z+OUTER)/(OUTER*2)));
    const axisAlpha=0.055+axisFrontness*0.23;
    line(center,out,`rgba(116,235,216,${axisAlpha.toFixed(3)})`,1,1);

    // small ticks only
    for(let level=1;level<=5;level++){
      const p=proj(posAt(i,level));
      const dx=p.x-center.x,dy=p.y-center.y;
      const len=Math.hypot(dx,dy)||1;
      const nx=-dy/len,ny=dx/len;
      const tick=level===5?5.5:3.4;
      line(
        {x:p.x-nx*tick,y:p.y-ny*tick},
        {x:p.x+nx*tick,y:p.y+ny*tick},
        level===5?'rgba(183,255,242,.48)':'rgba(143,236,221,.24)',
        level===5?1.1:.8,1
      );
    }
  }

  const world=scores.map((s,i)=>posAt(i,s));
  const screen=world.map(proj);

  if(showMesh){
    const faces=TRIS.map(t=>{
      const pts=t.map(i=>screen[i]);
      return {t,pts,z:(pts[0].z+pts[1].z+pts[2].z)/3};
    }).sort((a,b)=>a.z-b.z);

    faces.forEach(f=>{
      const avg=(scores[f.t[0]]+scores[f.t[1]]+scores[f.t[2]])/3;
      ctx.save();
      ctx.globalAlpha=.055+avg/5*.09;
      ctx.fillStyle='rgba(77,231,208,.68)';
      ctx.strokeStyle='rgba(142,255,236,.12)';
      ctx.lineWidth=.7;
      ctx.beginPath();
      ctx.moveTo(f.pts[0].x,f.pts[0].y);
      ctx.lineTo(f.pts[1].x,f.pts[1].y);
      ctx.lineTo(f.pts[2].x,f.pts[2].y);
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();
    });

    PAIRS.forEach(([a,b])=>{
      const zAvg=(screen[a].z+screen[b].z)/2;
      const frontness=1-Math.max(0,Math.min(1,(zAvg+OUTER)/(OUTER*2)));
      const alpha=0.045+frontness*0.24;
      line(screen[a],screen[b],`rgba(162,255,239,${alpha.toFixed(3)})`,.8,1);
    });
  }

  const order=screen.map((p,i)=>({p,i})).sort((a,b)=>a.p.z-b.p.z);

  order.forEach(({p,i})=>{
    const c=colorFor(scores[i]);
    const dx=p.x-center.x,dy=p.y-center.y;
    const len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;

    // bigger node
    dot(p,9.5,c,22,'rgba(238,255,252,.84)',1.4);

    // always-visible score, close to node
    const scoreX=p.x+ux*28;
    const scoreY=p.y+uy*28;
    roundedLabel(scoreX,scoreY,`${scores[i].toFixed(1)}`,{
      fs:10,
      px:6,py:4,
      bg:'rgba(2,10,12,.88)',
      border:'rgba(163,255,239,.18)',
      color:'#effffb'
    });

    if(showLabels){
      // leader line and area name far outside for clarity
      const leaderStart={x:p.x+ux*42,y:p.y+uy*42};
      const leaderEnd={x:p.x+ux*74,y:p.y+uy*74};
      line(leaderStart,leaderEnd,'rgba(183,255,243,.20)',.8,1);

      const ax=p.x+ux*96;
      const ay=p.y+uy*96;
      roundedLabel(ax,ay,AREAS[i],{
        fs:9,
        px:7,py:4,
        bg:'rgba(2,10,12,.68)',
        border:'rgba(255,255,255,.055)',
        color:'rgba(236,255,251,.78)'
      });
    }

    hitPoints.push({x:p.x,y:p.y,r:14*p.s,i});
  });

  dot(center,6.3,'rgba(233,255,251,.98)',22,'rgba(255,255,255,.6)',1);
  roundedLabel(center.x,center.y+28,'0',{
    fs:9,px:5,py:3,
    bg:'rgba(2,10,12,.72)',
    border:'rgba(255,255,255,.06)',
    color:'rgba(235,255,251,.6)'
  });
}

canvas.addEventListener('pointerdown',e=>{
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  resumeAutoAt=performance.now()+1800;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);

canvas.addEventListener('pointermove',e=>{
  if(dragging){
    yaw+=(e.clientX-lastX)*.008;
    pitch+=(e.clientY-lastY)*.008;
    pitch=Math.max(-1.3,Math.min(1.3,pitch));
    lastX=e.clientX;lastY=e.clientY;
    tip.style.display='none';
    draw();
    return;
  }

  let hit=null;
  for(const h of hitPoints){
    const dx=e.clientX-h.x,dy=e.clientY-h.y;
    if(dx*dx+dy*dy<h.r*h.r){hit=h;break}
  }

  if(hit){
    const perf=scores[hit.i];
    tip.style.display='block';
    tip.style.left=e.clientX+14+'px';
    tip.style.top=e.clientY+14+'px';
    tip.innerHTML=`<b>${AREAS[hit.i]}</b>
      <span>Performance: ${perf.toFixed(1)} / 5</span>
      <span>Severity equivalent: ${(5-perf).toFixed(1)} / 5</span>`;
    canvas.style.cursor='pointer';
  }else{
    tip.style.display='none';
    canvas.style.cursor='grab';
  }
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom*=Math.exp(-e.deltaY*.00115);
  zoom=Math.max(.62,Math.min(1.85,zoom));
  resumeAutoAt=performance.now()+1200;
  draw();
},{passive:false});

document.getElementById('labelsBtn').onclick=e=>{
  showLabels=!showLabels;
  e.currentTarget.classList.toggle('active',showLabels);
  draw();
};
document.getElementById('meshBtn').onclick=e=>{
  showMesh=!showMesh;
  e.currentTarget.classList.toggle('active',showMesh);
  draw();
};
document.getElementById('autoBtn').onclick=e=>{
  autoRotate=!autoRotate;
  e.currentTarget.classList.toggle('active',autoRotate);
  e.currentTarget.textContent=autoRotate?'Auto rotate':'Auto off';
};

document.getElementById('resetBtn').onclick=()=>{
  yaw=-0.52;pitch=0.45;zoom=1.16;
  draw();
};

function resize(){
  W=innerWidth;H=innerHeight;
  dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
addEventListener('resize',resize);
resize();

function animate(now){
  const dt=Math.min(40,now-lastFrame);
  lastFrame=now;

  if(autoRotate && !dragging && now>=resumeAutoAt){
    yaw += dt*0.000075;
    draw();
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
